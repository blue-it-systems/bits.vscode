name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-csharp-test-filter:
    name: Build C# Test Filter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: csharp-test-filter

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Lint code
        run: npm run lint

      - name: Package extension
        run: npx @vscode/vsce package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: csharp-test-filter-vsix-${{ github.sha }}
          path: 'csharp-test-filter/*.vsix'
          retention-days: 7

  test-gengora:
    name: Build Gengora
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build LSP Server
        run: |
          cd gengora/server
          dotnet build --configuration Release

      - name: Install extension dependencies
        run: |
          cd gengora/extension
          npm ci

      - name: Compile extension
        run: |
          cd gengora/extension
          npm run build

      - name: Bundle server with extension
        run: |
          cd gengora/extension
          npm run bundle-server

      - name: Package extension
        run: |
          cd gengora/extension
          npx @vscode/vsce package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: gengora-vsix-${{ github.sha }}
          path: 'gengora/extension/*.vsix'
          retention-days: 7

