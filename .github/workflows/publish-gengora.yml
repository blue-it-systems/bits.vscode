name: Publish Gengora Extension

on:
  push:
    tags:
      - 'gengora-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to marketplace (true/false)'
        required: true
        default: 'false'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build LSP Server
        run: |
          cd gengora/server
          dotnet build --configuration Release

      - name: Install extension dependencies
        run: |
          cd gengora/extension
          npm ci

      - name: Compile extension
        run: |
          cd gengora/extension
          npm run compile

      - name: Bundle server with extension
        run: |
          cd gengora/extension
          npm run bundle-server

      - name: Package extension
        run: |
          cd gengora/extension
          npx @vscode/vsce package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: gengora-vsix
          path: 'gengora/extension/*.vsix'
          retention-days: 30

      - name: Publish to VS Code Marketplace
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
        run: |
          cd gengora/extension
          npx @vscode/vsce publish -p ${{ secrets.VSCE_PAT }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          files: gengora/extension/*.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
